[package]
name = "ranis"
version = "0.1.2"
edition = "2021"

description = "Ranis is a collection of polymorphic shellcode encoders for **offensive security operations** and **penetration testing**. Encoders obfuscate a raw payload by wrapping it in a self-decoding stub, so its bytes no longer match static signatures used by antivirus/EDR products, while remaining fully functional at runtime. Multiple stages can be chained together, each one re-encoding the previous stage's output, and every encoder can be constrained to avoid a configurable set of bad characters (e.g. `0x00`, `0x0a`, `0x0d`) that would otherwise break delivery through the target's input path."
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.98"
byteorder = "1.5.0"
clap = { version = "4.5.39", features = ["derive"] }
thiserror = "2.0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34+deprecated"
pyo3 = { version = "0.29.2", features = ["extension-module"], optional = true }
rand = { version = "0.10.2", features = ["chacha"] }
dynasmrt = "5.1.0"

[features]
default = []
python = ["pyo3"]

[lib]
name = "ranis"
crate-type = ["cdylib", "staticlib", "rlib"]
