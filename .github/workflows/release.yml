name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-rust-packages:
    name: Build (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.os }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            target/release/*.lib
            target/release/*.a
            target/release/*.rlib
          if-no-files-found: ignore

  build-python-packages:
    name: Python Package (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install maturin
        run: python -m pip install --upgrade maturin

      - name: Clean stale wheels
        shell: bash
        run: rm -rf target/wheels

      - name: Build Python wheel
        run: maturin build --release --features python

      - name: Upload Python package
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.os }}
          path: target/wheels/
          if-no-files-found: error

  publish-rust:
    name: Publish Rust to crates.io

    needs:
      - build-rust-packages

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check if version already published
        id: check
        run: |
          PKG_NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/$PKG_NAME/$PKG_VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PKG_NAME v$PKG_VERSION already exists on crates.io, skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package
        if: steps.check.outputs.exists == 'false'
        run: cargo publish --dry-run --allow-dirty

      - name: Publish to crates.io
        if: steps.check.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: cargo publish --allow-dirty

  publish-python:
    name: Publish Python to PyPI

    needs:
      - build-python-packages

    runs-on: ubuntu-latest

    steps:
      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: artifacts/python
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish --check-url https://pypi.org/simple/ artifacts/python/*

  release:
    name: Create GitHub Release
    needs:
      - publish-rust
      - publish-python

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Rust artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: rust-*
          path: artifacts/rust
          merge-multiple: true

      - name: Download Python package
        uses: actions/download-artifact@v6
        with:
          pattern: python-*
          path: artifacts/python
          merge-multiple: true

      - name: Show release artifacts
        run: |
          echo "Rust artifacts:"
          find artifacts/rust -type f -print

          echo "Python artifacts:"
          find artifacts/python -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            artifacts/rust/* \
            artifacts/python/*
